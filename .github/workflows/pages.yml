name: Publicar o Modelador (GitHub Pages)

# Publica a aba Modelador em https://problemsbloxcreate-lab.github.io/modelador/ (site novo do Estúdio Problems, com o login
# do Google do menu: /estudio-login.js). Monta: index.html (raiz) → index.html e blockbench/app → blockbench/.
# A página fica na RAIZ do repositório de propósito: assim o site também funciona se o Pages estiver "por pasta" (Deploy from a branch).
# Os modelos NÃO vão para cá: o banco é privado e a página busca pelo servidor da equipe (senha da equipe).
# Uma vez só: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["index.html", "blockbench/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r blockbench/app _site/blockbench
          touch _site/.nojekyll
          du -sh _site; find _site -type f | wc -l
      - name: Deixar o Pages publicando só por esta Action (senão o GitHub publica a pasta por cima e aparece o README)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          antes=$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null || echo '?')
          echo "Modo do Pages antes: $antes"
          if [ "$antes" != "workflow" ]; then
            if gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow >/dev/null 2>err.txt; then echo "::notice::Pages trocado para GitHub Actions (antes: $antes)";
            else echo "::warning::Não consegui trocar o Pages sozinho ($(head -c 200 err.txt)). Troque em Settings → Pages → Source: GitHub Actions."; fi
          else echo "::notice::Pages já publica só por esta Action"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
